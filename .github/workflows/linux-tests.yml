name: Linux tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch AtCoder Library
        shell: bash
        run: |
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach \
            864245a00b00dd008d1abfdc239618fdb7d139da

      - name: Compile and run tests
        shell: bash
        run: |
          mkdir -p out/tests
          g++ --version > out/tests/compiler.txt
          printf '| Test | Result | Compile | Run |\n| --- | --- | ---: | ---: |\n' \
            >> "$GITHUB_STEP_SUMMARY"

          format_seconds() {
            local ns="$1"
            printf '%d.%03d s' "$((ns / 1000000000))" \
              "$(((ns % 1000000000) / 1000000))"
          }

          total=0
          failed=0
          total_compile_ns=0
          total_run_ns=0

          while IFS= read -r -d '' source; do
            total=$((total + 1))
            id="${source#./}"
            id="${id//\//_}"
            exe="out/tests/${id}.exe"
            result=PASS
            run_time="—"

            compile_start=$(date +%s%N)
            if g++ -std=c++23 -O2 -g -Wall -Wextra \
                -I. -Idebug -I.deps/ac-library \
                "$source" -o "$exe" \
                > "out/tests/${id}.build.log" 2>&1; then
              compile_end=$(date +%s%N)
              run_start=$(date +%s%N)
              if timeout 60s "$exe" < /dev/null \
                  > "out/tests/${id}.stdout.log" \
                  2> "out/tests/${id}.stderr.log"; then
                result=PASS
              else
                code=$?
                result="RUN FAIL (exit ${code})"
              fi
              run_end=$(date +%s%N)
              run_ns=$((run_end - run_start))
              total_run_ns=$((total_run_ns + run_ns))
              run_time=$(format_seconds "$run_ns")
            else
              compile_end=$(date +%s%N)
              result="BUILD FAIL"
            fi

            compile_ns=$((compile_end - compile_start))
            total_compile_ns=$((total_compile_ns + compile_ns))
            compile_time=$(format_seconds "$compile_ns")

            if [[ "$result" != PASS ]]; then
              failed=$((failed + 1))
              if [[ "$result" == "BUILD FAIL" ]]; then
                cat "out/tests/${id}.build.log" >&2
              elif [[ -f "out/tests/${id}.stderr.log" ]]; then
                cat "out/tests/${id}.stderr.log" >&2
              fi
            fi

            printf '%s %s\n' "$result" "$source"
            printf '| `%s` | %s | %s | %s |\n' \
              "$source" "$result" "$compile_time" "$run_time" \
              >> "$GITHUB_STEP_SUMMARY"
          done < <(
            find . \
              \( -path './.git' -o -path './.deps' -o -path './out' \) \
              -prune -o \
              -type f -name '*.cpp' \
              \( -path '*/test/*' -o -path '*/debug_test/*' \) \
              ! -name '*generator*' -print0 \
              | sort -z
          )

          printf '| **Total** | **%s/%s passed** | **%s** | **%s** |\n' \
            "$((total - failed))" "$total" \
            "$(format_seconds "$total_compile_ns")" \
            "$(format_seconds "$total_run_ns")" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "$((total - failed))/${total} passed"

          [[ "$total" -gt 0 && "$failed" -eq 0 ]]

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: out/tests/
          retention-days: 14
