name: Performance A/B comparison
run-name: 'A/B ${{ inputs.target }} cap=${{ inputs.caps }} runs=${{ inputs.runs }} | ${{ inputs.base_ref }} vs ${{ inputs.development_ref }}'

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch name or full commit SHA (default main)
        type: string
        required: true
        default: main
      development_ref:
        description: Development branch name or full commit SHA to compare with base
        type: string
        required: true
      target:
        description: Benchmark target
        type: choice
        options:
          - all
          - btree/set
          - btree/vector
          - btree/segtree
          - btree/lazysegtree
          - btree/set/insert
          - btree/set/erase
          - btree/set/access
          - btree/set/access_random
          - btree/set/lower_bound
          - btree/set/iterate
          - btree/vector/insert
          - btree/vector/erase
          - btree/vector/reverse
          - btree/vector/access
          - btree/vector/access_random
          - btree/vector/split_merge
          - btree/vector/range_erase
          - btree/vector/iterate
          - btree/vector/iterate_interleaved_reverse
          - btree/segtree/prod
          - btree/segtree/insert
          - btree/segtree/erase
          - btree/segtree/reverse
          - btree/segtree/access
          - btree/segtree/access_random
          - btree/segtree/split_merge
          - btree/segtree/range_erase
          - btree/segtree/max_right
          - btree/segtree/min_left
          - btree/segtree/iterate
          - btree/segtree/iterate_interleaved_reverse
          - btree/lazysegtree/prod
          - btree/lazysegtree/apply
          - btree/lazysegtree/insert
          - btree/lazysegtree/erase
          - btree/lazysegtree/reverse
          - btree/lazysegtree/access
          - btree/lazysegtree/access_random
          - btree/lazysegtree/split_merge
          - btree/lazysegtree/range_erase
          - btree/lazysegtree/max_right
          - btree/lazysegtree/min_left
          - btree/lazysegtree/iterate
          - btree/lazysegtree/iterate_interleaved_reverse
          - btree/lazysegtree/iterate_interleaved_apply
          - btree/set/mixed_uniform
          - btree/set/mixed_edges
          - btree/set/mixed_hotspot
          - btree/vector/mixed_uniform
          - btree/vector/mixed_edges
          - btree/vector/mixed_hotspot
          - btree/segtree/mixed_uniform
          - btree/segtree/mixed_edges
          - btree/segtree/mixed_hotspot
          - btree/lazysegtree/mixed_uniform
          - btree/lazysegtree/mixed_edges
          - btree/lazysegtree/mixed_hotspot
          - btree/set/mixed_growth
          - btree/set/mixed_shrink
          - btree/vector/mixed_growth
          - btree/vector/mixed_shrink
          - btree/segtree/mixed_growth
          - btree/segtree/mixed_shrink
          - btree/lazysegtree/mixed_growth
          - btree/lazysegtree/mixed_shrink
        default: all
      caps:
        description: Node capacities
        type: choice
        options:
          - all
          - '8'
          - '16'
          - '32'
          - '64'
        default: all
      runs:
        description: Measurements per variant (alternating order)
        type: choice
        options:
          - '3'
          - '5'
          - '7'
        default: '5'

permissions:
  contents: write

# Serialized with Performance benchmarks: both may publish main bests.
concurrency:
  group: benchmark-records
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure Git safe directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure Python and GNU time are available
        shell: bash
        run: |
          if ! command -v python3 >/dev/null || [[ ! -x /usr/bin/time ]]; then
            apt-get update -qq
            apt-get install -y -qq python3 time
          fi

      - name: Test benchmark measurement utilities
        shell: bash
        run: python3 -m unittest discover -s benchmark/tests -p 'test_*.py'

      - name: Fetch AtCoder Library
        shell: bash
        run: |
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach 864245a00b00dd008d1abfdc239618fdb7d139da

      - name: Checkout both comparison refs on the same runner
        id: comparison_refs
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          DEVELOPMENT_REF: ${{ inputs.development_ref }}
        run: |
          # Workflow and fixtures are intentionally taken from the main checkout.
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main; choose comparison refs in the inputs." >&2
            exit 1
          fi
          main_sha=$(git rev-parse HEAD)
          resolve_ref() {
            local ref="$1" remote_ref="$2"
            if [[ "$ref" == "main" ]]; then
              printf '%s\n' "$main_sha"
            elif [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              git fetch --no-tags origin "$ref" >&2
              git rev-parse 'FETCH_HEAD^{commit}'
            else
              git check-ref-format --branch "$ref" >&2
              git fetch --no-tags origin "+refs/heads/$ref:refs/remotes/origin/$remote_ref" >&2
              git rev-parse "refs/remotes/origin/$remote_ref^{commit}"
            fi
          }
          base_sha=$(resolve_ref "$BASE_REF" compare-base)
          dev_sha=$(resolve_ref "$DEVELOPMENT_REF" compare-development)
          echo "Resolved base: $BASE_REF @ $base_sha"
          echo "Resolved development: $DEVELOPMENT_REF @ $dev_sha"

          for variant in base dev; do
            if [[ "$variant" == "base" ]]; then
              sha="$base_sha"
            else
              sha="$dev_sha"
            fi
            checkout_dir="$GITHUB_WORKSPACE/out/benchmark/ab-$variant-checkout"
            mkdir -p "$GITHUB_WORKSPACE/out/benchmark"
            git worktree add --detach "$checkout_dir" "$sha"
            git config --global --add safe.directory "$checkout_dir"
            mkdir -p "$checkout_dir/.deps"
            ln -s "$GITHUB_WORKSPACE/.deps/ac-library" "$checkout_dir/.deps/ac-library"
          done

          if [[ "$base_sha" == "$main_sha" ]]; then
            echo "base_is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "base_is_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load historical main bests (read only)
        if: steps.comparison_refs.outputs.base_is_main == 'true'
        shell: bash
        run: |
          mkdir -p out/benchmark
          git ls-remote --heads origin refs/heads/benchmark-records > out/benchmark/remote-head.txt
          if [[ -s out/benchmark/remote-head.txt ]]; then
            git fetch origin benchmark-records:refs/remotes/origin/benchmark-records
            git show refs/remotes/origin/benchmark-records:best.json > out/benchmark/best.json
          else
            printf '{"schema":1,"records":{}}\n' > out/benchmark/best.json
          fi

      - name: Initialize empty baseline for non-main comparisons
        if: steps.comparison_refs.outputs.base_is_main != 'true'
        shell: bash
        run: |
          mkdir -p out/benchmark
          printf '{"schema":1,"records":{}}\n' > out/benchmark/best.json

      # Main owns benchmark sources and fixtures. Both library versions are
      # compiled from separate worktrees with identical compiler flags.
      - name: Compare runtime and peak RSS
        shell: bash
        env:
          BENCHMARK_TARGET: ${{ inputs.target }}
          BENCHMARK_CAPS: ${{ inputs.caps }}
          BENCHMARK_RUNS: ${{ inputs.runs }}
          BASE_REF: ${{ inputs.base_ref }}
          DEVELOPMENT_REF: ${{ inputs.development_ref }}
        run: |
          python3 benchmark/compare.py \
            --base-root "$GITHUB_WORKSPACE" \
            --base-library-root "$GITHUB_WORKSPACE/out/benchmark/ab-base-checkout" \
            --dev-root "$GITHUB_WORKSPACE/out/benchmark/ab-dev-checkout" \
            --base-label "$BASE_REF" --dev-label "$DEVELOPMENT_REF" \
            --target "$BENCHMARK_TARGET" --caps "$BENCHMARK_CAPS" \
            --runs "$BENCHMARK_RUNS" --baseline out/benchmark/best.json

      - name: Update main best records
        if: github.ref == 'refs/heads/main' && steps.comparison_refs.outputs.base_is_main == 'true'
        uses: ./.github/actions/push-benchmark-records

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ab-results
          path: out/benchmark/compare/
          retention-days: 14
