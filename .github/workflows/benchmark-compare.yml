name: Performance A/B comparison

on:
  workflow_dispatch:
    inputs:
      development_ref:
        description: Development branch name or full commit SHA to compare with main
        type: string
        required: true
      target:
        description: Benchmark target
        type: choice
        options:
          - all
          - btree/set
          - btree/vector
          - btree/segtree
          - btree/lazysegtree
          - btree/set/insert
          - btree/set/erase
          - btree/set/access
          - btree/set/access_random
          - btree/set/lower_bound
          - btree/set/iterate
          - btree/vector/insert
          - btree/vector/erase
          - btree/vector/reverse
          - btree/vector/access
          - btree/vector/access_random
          - btree/vector/split_merge
          - btree/vector/range_erase
          - btree/vector/iterate
          - btree/vector/iterate_interleaved_reverse
          - btree/segtree/prod
          - btree/segtree/insert
          - btree/segtree/erase
          - btree/segtree/reverse
          - btree/segtree/access
          - btree/segtree/access_random
          - btree/segtree/split_merge
          - btree/segtree/range_erase
          - btree/segtree/max_right
          - btree/segtree/min_left
          - btree/segtree/iterate
          - btree/segtree/iterate_interleaved_reverse
          - btree/lazysegtree/prod
          - btree/lazysegtree/apply
          - btree/lazysegtree/insert
          - btree/lazysegtree/erase
          - btree/lazysegtree/reverse
          - btree/lazysegtree/access
          - btree/lazysegtree/access_random
          - btree/lazysegtree/split_merge
          - btree/lazysegtree/range_erase
          - btree/lazysegtree/max_right
          - btree/lazysegtree/min_left
          - btree/lazysegtree/iterate
          - btree/lazysegtree/iterate_interleaved_reverse
          - btree/lazysegtree/iterate_interleaved_apply
          - btree/set/mixed_uniform
          - btree/set/mixed_edges
          - btree/set/mixed_hotspot
          - btree/vector/mixed_uniform
          - btree/vector/mixed_edges
          - btree/vector/mixed_hotspot
          - btree/segtree/mixed_uniform
          - btree/segtree/mixed_edges
          - btree/segtree/mixed_hotspot
          - btree/lazysegtree/mixed_uniform
          - btree/lazysegtree/mixed_edges
          - btree/lazysegtree/mixed_hotspot
          - btree/set/mixed_growth
          - btree/set/mixed_shrink
          - btree/vector/mixed_growth
          - btree/vector/mixed_shrink
          - btree/segtree/mixed_growth
          - btree/segtree/mixed_shrink
          - btree/lazysegtree/mixed_growth
          - btree/lazysegtree/mixed_shrink
        default: all
      caps:
        description: Node capacities
        type: choice
        options:
          - all
          - '8'
          - '16'
          - '32'
          - '64'
        default: all
      runs:
        description: Measurements per variant (alternating order)
        type: choice
        options:
          - '3'
          - '5'
          - '7'
        default: '5'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 180
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure Git safe directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure Python and GNU time are available
        shell: bash
        run: |
          if ! command -v python3 >/dev/null || [[ ! -x /usr/bin/time ]]; then
            apt-get update -qq
            apt-get install -y -qq python3 time
          fi

      - name: Test benchmark measurement utilities
        shell: bash
        run: python3 -m unittest discover -s benchmark/tests -p 'test_*.py'

      - name: Fetch AtCoder Library
        shell: bash
        run: |
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach 864245a00b00dd008d1abfdc239618fdb7d139da

      - name: Checkout development ref on the same runner
        shell: bash
        env:
          DEVELOPMENT_REF: ${{ inputs.development_ref }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main; select the development ref in the input." >&2
            exit 1
          fi
          if [[ "$DEVELOPMENT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch --no-tags origin "$DEVELOPMENT_REF"
            dev_sha=$(git rev-parse FETCH_HEAD^{commit})
          else
            git check-ref-format --branch "$DEVELOPMENT_REF"
            git fetch --no-tags origin "+refs/heads/${DEVELOPMENT_REF}:refs/remotes/origin/compare-development"
            dev_sha=$(git rev-parse refs/remotes/origin/compare-development^{commit})
          fi
          dev_dir="$GITHUB_WORKSPACE/out/benchmark/ab-dev-checkout"
          mkdir -p "$GITHUB_WORKSPACE/out/benchmark"
          git worktree add --detach "$dev_dir" "$dev_sha"
          git config --global --add safe.directory "$dev_dir"
          mkdir -p "$dev_dir/.deps"
          ln -s "$GITHUB_WORKSPACE/.deps/ac-library" "$dev_dir/.deps/ac-library"

      - name: Load historical main bests (read only)
        shell: bash
        run: |
          mkdir -p out/benchmark
          git ls-remote --heads origin refs/heads/benchmark-records > out/benchmark/remote-head.txt
          if [[ -s out/benchmark/remote-head.txt ]]; then
            git fetch origin benchmark-records:refs/remotes/origin/benchmark-records
            git show refs/remotes/origin/benchmark-records:best.json > out/benchmark/best.json
          else
            printf '{"schema":1,"records":{}}\n' > out/benchmark/best.json
          fi

      # Main owns workload definitions and fixtures; the development worktree
      # supplies only the library headers used at compilation.
      - name: Compare runtime and peak RSS
        shell: bash
        env:
          BENCHMARK_TARGET: ${{ inputs.target }}
          BENCHMARK_CAPS: ${{ inputs.caps }}
          BENCHMARK_RUNS: ${{ inputs.runs }}
        run: |
          python3 benchmark/compare.py --base-root "$GITHUB_WORKSPACE" --dev-root "$GITHUB_WORKSPACE/out/benchmark/ab-dev-checkout" --target "$BENCHMARK_TARGET" --caps "$BENCHMARK_CAPS" --runs "$BENCHMARK_RUNS" --baseline out/benchmark/best.json

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-ab-results
          path: out/benchmark/compare/
          retention-days: 14
