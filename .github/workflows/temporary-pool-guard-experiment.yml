name: Temporary B+tree pool static guard experiment

on:
  push:
    branches:
      - perf/bplustree-static-pool-no-guard

permissions:
  contents: read

jobs:
  inspect-and-compare:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compiler and ACL
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null || [[ ! -x /usr/bin/time ]]; then
            apt-get update -qq
            apt-get install -y -qq python3 time
          fi
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach 864245a00b00dd008d1abfdc239618fdb7d139da
      - name: Compile and run B+tree unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tests
          for file in data-structure/btree/components/test/*.cpp data-structure/btree/test/*.cpp; do
            echo "::group::$file"
            g++ -std=c++23 -O2 -Wall -Wextra -I. -Idebug -I.deps/ac-library "$file" -o out/tests/pool-test
            timeout 70s out/tests/pool-test
            echo "::endgroup::"
          done
      - name: Create old Pool baseline and Main benchmark sources
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 878222b31edfc6e3159f5cb8ec4fad0461d5a67c
          git worktree add --detach "$GITHUB_WORKSPACE/out/guard-ab/old" FETCH_HEAD
          git fetch --no-tags origin main
          git worktree add --detach "$GITHUB_WORKSPACE/out/guard-ab/main" FETCH_HEAD
          for path in "$GITHUB_WORKSPACE/out/guard-ab/old" "$GITHUB_WORKSPACE/out/guard-ab/main"; do
            git config --global --add safe.directory "$path"
            mkdir -p "$path/.deps"
            ln -s "$GITHUB_WORKSPACE/.deps/ac-library" "$path/.deps/ac-library"
          done
          printf '%s\n' '{"schema":1,"records":{}}' > "$GITHUB_WORKSPACE/out/guard-ab/empty.json"
          # This experiment compares two Pool revisions, not Main vs Development.
          # Keep benchmark sources and fixtures from Main but allow old Pool as base-root.
          sed -i '/    if base_root != benchmark.ROOT:/,+1d' "$GITHUB_WORKSPACE/out/guard-ab/main/benchmark/compare.py"
      - name: Inspect GCC 15.2 assembly for pool access
        shell: bash
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/out/guard-ab/probe.cpp" <<'CPP'
          #include "data-structure/btree/components/bplustree-node.hpp"
          using P = Bplustree::NodePools<Bplustree::Traits<long long, 32>>;
          extern "C" __attribute__((noinline)) auto probe_pool() {
            return &P::internals();
          }
          CPP
          for variant in old new; do
            if [[ "$variant" == old ]]; then
              root="$GITHUB_WORKSPACE/out/guard-ab/old"
            else
              root="$GITHUB_WORKSPACE"
            fi
            g++ -std=c++23 -O2 -S -masm=intel -I"$root" \
              "$GITHUB_WORKSPACE/out/guard-ab/probe.cpp" \
              -o "$GITHUB_WORKSPACE/out/guard-ab/$variant.s"
            echo "::group::assembly $variant"
            sed -n '/^probe_pool:/,/^[[:space:]]*\.size[[:space:]]*probe_pool/p' "$GITHUB_WORKSPACE/out/guard-ab/$variant.s" | head -45
            echo "::endgroup::"
          done
          grep -q '_ZGVZ.*internals' "$GITHUB_WORKSPACE/out/guard-ab/old.s"
          if grep -q '_ZGVZ.*internals' "$GITHUB_WORKSPACE/out/guard-ab/new.s"; then
            echo "Guard remained in new pool access" >&2
            exit 1
          fi
          echo "Verified: local-static guard in old code, absent in new code"
      - name: Benchmark old Pool vs guardless Pool on the same CPU
        shell: bash
        run: |
          set -euo pipefail
          main="$GITHUB_WORKSPACE/out/guard-ab/main"
          old="$GITHUB_WORKSPACE/out/guard-ab/old"
          for target in \
            btree/vector/access \
            btree/vector/access_random \
            btree/set/access \
            btree/set/access_random \
            btree/vector/iterate; do
            echo "::group::A/B $target"
            python3 "$main/benchmark/compare.py" \
              --base-root "$old" --dev-root "$GITHUB_WORKSPACE" \
              --target "$target" --caps 8,32,64 --runs 7 \
              --baseline "$GITHUB_WORKSPACE/out/guard-ab/empty.json"
            echo "::endgroup::"
          done
