name: Temporary split iterator epochs A/B

on:
  push:
    branches:
      - feature/bplustree-split-iterator-epochs

permissions:
  contents: read

jobs:
  validate-and-compare:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compiler and benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null || [[ ! -x /usr/bin/time ]]; then
            apt-get update -qq
            apt-get install -y -qq python3 time
          fi
          mkdir -p .deps out/tests
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach 864245a00b00dd008d1abfdc239618fdb7d139da
      - name: GCC 15.2 B+tree unit tests
        shell: bash
        run: |
          set -euo pipefail
          for file in data-structure/btree/components/test/*.cpp data-structure/btree/test/*.cpp; do
            echo "::group::$file"
            g++ -std=c++23 -O2 -Wall -Wextra -I. -Idebug -I.deps/ac-library "$file" -o out/tests/split-epoch-test
            timeout 75s out/tests/split-epoch-test
            echo "::endgroup::"
          done
      - name: Prepare previous development baseline and Main fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/out/split-ab"
          git fetch --no-tags origin 01d766f7f8a97b6b5db2e650f5765d3c68d40b48
          git worktree add --detach "$GITHUB_WORKSPACE/out/split-ab/old" FETCH_HEAD
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git worktree add --detach "$GITHUB_WORKSPACE/out/split-ab/main" refs/remotes/origin/main
          for path in "$GITHUB_WORKSPACE/out/split-ab/old" "$GITHUB_WORKSPACE/out/split-ab/main"; do
            git config --global --add safe.directory "$path"
            mkdir -p "$path/.deps"
            ln -s "$GITHUB_WORKSPACE/.deps/ac-library" "$path/.deps/ac-library"
          done
          printf '%s\n' '{"schema":1,"records":{}}' > "$GITHUB_WORKSPACE/out/split-ab/empty.json"
          sed -i '/    if base_root != benchmark.ROOT:/,+1d' "$GITHUB_WORKSPACE/out/split-ab/main/benchmark/compare.py"
          echo "OLD_POOL=$(git -C "$GITHUB_WORKSPACE/out/split-ab/old" rev-parse HEAD)"
          echo "NEW_POOL=$(git rev-parse HEAD)"
      - name: A/B all access and iterate scenarios
        if: false # already covered by the first full A/B run
        shell: bash
        run: |
          set -euo pipefail
          main="$GITHUB_WORKSPACE/out/split-ab/main"
          old="$GITHUB_WORKSPACE/out/split-ab/old"
          for structure in set vector segtree lazysegtree; do
            for operation in access access_random iterate; do
              target="btree/$structure/$operation"
              echo "::group::A/B $target all caps 5 runs"
              python3 "$main/benchmark/compare.py" \
                --base-root "$old" --dev-root "$GITHUB_WORKSPACE" \
                --target "$target" --caps all --runs 5 \
                --baseline "$GITHUB_WORKSPACE/out/split-ab/empty.json"
              echo "::endgroup::"
            done
          done
      - name: A/B interleaved iterator operation scenarios
        shell: bash
        run: |
          set -euo pipefail
          main="$GITHUB_WORKSPACE/out/split-ab/main"
          old="$GITHUB_WORKSPACE/out/split-ab/old"
          for target in \
            btree/vector/iterate_interleaved_reverse \
            btree/segtree/iterate_interleaved_reverse \
            btree/lazysegtree/iterate_interleaved_reverse \
            btree/lazysegtree/iterate_interleaved_apply; do
            echo "::group::A/B $target"
            python3 "$main/benchmark/compare.py" \
              --base-root "$old" --dev-root "$GITHUB_WORKSPACE" \
              --target "$target" --caps all --runs 5 \
              --baseline "$GITHUB_WORKSPACE/out/split-ab/empty.json"
            echo "::endgroup::"
          done
          echo "All A/B scenarios complete"


      - name: A/B iterator movement without dereference after all_apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import statistics
          import subprocess
          from pathlib import Path
          
          root = Path(os.environ["GITHUB_WORKSPACE"])
          old = root / "out/split-ab/old"
          build = root / "out/split-ab/micro"
          build.mkdir(parents=True, exist_ok=True)
          code = r"""#include <bits/stdc++.h>
          #include "data-structure/btree/bplustree-lazysegtree.hpp"
          using namespace std;
          using Tree = BLazySegtree<
              long long, long long,
              [](long long a, long long b) { return a + b; },
              []() { return 0LL; }, AddSumMapping, AddComposition, true, NODE_CAP>;
          signed main() {
            constexpr long long N = 100000;
            vector<long long> values(N);
            iota(values.begin(), values.end(), 0LL);
            Tree tree(values.begin(), values.end());
            auto it = tree.nth(0);
            tree.all_apply(7);
            auto start = chrono::steady_clock::now();
            for (long long i = 0; i < N; ++i) ++it;
            auto end = chrono::steady_clock::now();
            auto ns = chrono::duration_cast<chrono::nanoseconds>(end - start).count();
            cerr << "BENCHMARK_NS=" << ns << '\n';
            if (it != tree.end()) return 2;
            if (tree.all_prod() != N * (N - 1) / 2 + N * 7) return 3;
            cout << tree.get(0) << ' ' << tree.size() << '\n';
          }
          """
          src = build / "move_only.cpp"
          src.write_text(code, encoding="utf-8")
          for cap in (8, 32, 64):
              exes = {}
              for variant, library in (("old", old), ("new", root)):
                  exe = build / f"{variant}_cap{cap}"
                  subprocess.run(["g++", "-std=c++23", "-O2", "-Wall", "-Wextra",
                                  f"-DNODE_CAP={cap}", "-I", str(library),
                                  "-I", str(library / "debug"),
                                  "-I", str(library / ".deps/ac-library"),
                                  str(src), "-o", str(exe)], check=True, timeout=180)
                  exes[variant] = exe
              samples = {"old": [], "new": []}
              for iteration in range(5):
                  order = ("old", "new") if iteration % 2 == 0 else ("new", "old")
                  for variant in order:
                      proc = subprocess.run([str(exes[variant])], capture_output=True,
                                            text=True, check=True, timeout=90)
                      if proc.stdout != "7 100000\n":
                          raise RuntimeError(f"Unexpected {variant} output: {proc.stdout!r}")
                      m = re.search(r"BENCHMARK_NS=(\d+)", proc.stderr)
                      if not m:
                          raise RuntimeError(f"Missing time in {variant} stderr: {proc.stderr}")
                      ms = int(m.group(1)) / 1e6
                      samples[variant].append(ms)
                      print(f"move-only cap{cap} {variant} {iteration+1}/5 {ms:.3f} ms", flush=True)
              a = statistics.median(samples["old"])
              b = statistics.median(samples["new"])
              print(f"RESULT move-only cap{cap}: old={a:.3f} ms, new={b:.3f} ms, ratio={b/a*100:.1f}%", flush=True)
          
          PY
