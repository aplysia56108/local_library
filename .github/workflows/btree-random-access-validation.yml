name: Temporary B+tree shuffled-access validation

on:
  push:
    branches:
      - benchmark/btree-random-index-access

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3 time
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach 864245a00b00dd008d1abfdc239618fdb7d139da
      - name: Validate all shuffled access variants and capacities
        shell: bash
        run: |
          set -euo pipefail
          for tree in set vector segtree lazysegtree; do
            python3 benchmark/run.py --target "btree/$tree/access_random" \
              --caps 8,16,32,64 --runs 1 \
              --baseline "/tmp/empty-best-$tree.json" \
              --updated "/tmp/updated-best-$tree.json"
          done
