name: Temporary VisitAll removal validation

on:
  push:
    branches:
      - experiment/bplustree-remove-visitall-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare GCC and AtCoder Library
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null || [[ ! -x /usr/bin/time ]]; then
            apt-get update -qq
            apt-get install -y -qq python3 time
          fi
          mkdir -p .deps out/tests out/visitall-check
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach 864245a00b00dd008d1abfdc239618fdb7d139da
          g++ --version | head -1
      - name: Assert VisitAll references are gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'VisitAll|VisitALL' \
            data-structure/btree/components/bplustree-iterator.hpp \
            data-structure/btree/components/bplustree-base.hpp; then
            echo 'Obsolete VisitAll reference remains'
            exit 1
          fi
          echo 'VisitAll references removed from the iterator and Base.'
      - name: Compile and run full B+tree test suites
        shell: bash
        run: |
          set -euo pipefail
          for file in data-structure/btree/components/test/*.cpp data-structure/btree/test/*.cpp; do
            echo "::group::$file"
            g++ -std=c++23 -O2 -Wall -Wextra -I. -Idebug -I.deps/ac-library \
              "$file" -o out/tests/bplustree-visitall
            timeout 75s out/tests/bplustree-visitall
            echo "::endgroup::"
          done
          echo 'All B+tree test suites passed'
      - name: Prepare pre-removal baseline and Main benchmark fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 8a7ed928b9abcb464d74f7af44892cd63f285602
          git worktree add --detach "$GITHUB_WORKSPACE/out/visitall-check/old" FETCH_HEAD
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git worktree add --detach "$GITHUB_WORKSPACE/out/visitall-check/main" refs/remotes/origin/main
          for path in "$GITHUB_WORKSPACE/out/visitall-check/old" "$GITHUB_WORKSPACE/out/visitall-check/main"; do
            git config --global --add safe.directory "$path"
            mkdir -p "$path/.deps"
            ln -s "$GITHUB_WORKSPACE/.deps/ac-library" "$path/.deps/ac-library"
          done
          printf '%s\n' '{"schema":1,"records":{}}' > "$GITHUB_WORKSPACE/out/visitall-check/empty.json"
          sed -i '/    if base_root != benchmark.ROOT:/,+1d' "$GITHUB_WORKSPACE/out/visitall-check/main/benchmark/compare.py"
          echo "Old: $(git -C "$GITHUB_WORKSPACE/out/visitall-check/old" rev-parse HEAD)"
          echo "New: $(git rev-parse HEAD)"
      - name: Same-CPU A/B iterate after VisitAll removal
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/out/visitall-check"
          for structure in set vector segtree lazysegtree; do
            echo "::group::A/B $structure iterate (caps 8,32; 5 runs)"
            python3 "$root/main/benchmark/compare.py" \
              --base-root "$root/old" --dev-root "$GITHUB_WORKSPACE" \
              --target "btree/$structure/iterate" --caps '8,32' --runs 5 \
              --baseline "$root/empty.json"
            echo "::endgroup::"
          done
          echo 'All 8 A/B cases passed output verification'
