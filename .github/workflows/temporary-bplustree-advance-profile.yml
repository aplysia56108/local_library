name: Temporary B+tree advance fast-path investigation

on:
  push:
    branches:
      - experiment/bplustree-advance-direct-leaf-20261117

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compiler and ACL
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null || [[ ! -x /usr/bin/time ]]; then
            apt-get update -qq
            apt-get install -y -qq python3 time
          fi
          mkdir -p .deps out/tests out/advance-experiment
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach 864245a00b00dd008d1abfdc239618fdb7d139da
          echo "Compiler: $(g++ --version | head -1)"
          grep -m1 'model name' /proc/cpuinfo
      - name: GCC 15.2 full B+tree tests
        shell: bash
        run: |
          set -euo pipefail
          for file in data-structure/btree/components/test/*.cpp data-structure/btree/test/*.cpp; do
            echo "::group::$file"
            g++ -std=c++23 -O2 -Wall -Wextra -I. -Idebug -I.deps/ac-library "$file" -o out/tests/advance-test
            timeout 75s out/tests/advance-test
            echo "::endgroup::"
          done
      - name: Prepare single epoch and split epoch reference versions
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin 01d766f7f8a97b6b5db2e650f5765d3c68d40b48
          git worktree add --detach "$GITHUB_WORKSPACE/out/advance-experiment/single" FETCH_HEAD
          git fetch --no-tags origin e233df156cafbd956874344bdac27471dcbc7438
          git worktree add --detach "$GITHUB_WORKSPACE/out/advance-experiment/split" FETCH_HEAD
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git worktree add --detach "$GITHUB_WORKSPACE/out/advance-experiment/main" refs/remotes/origin/main
          for v in single split main; do
            path="$GITHUB_WORKSPACE/out/advance-experiment/$v"
            git config --global --add safe.directory "$path"
            mkdir -p "$path/.deps"
            ln -s "$GITHUB_WORKSPACE/.deps/ac-library" "$path/.deps/ac-library"
          done
          printf '%s\n' '{"schema":1,"records":{}}' > "$GITHUB_WORKSPACE/out/advance-experiment/empty.json"
          sed -i '/    if base_root != benchmark.ROOT:/,+1d' "$GITHUB_WORKSPACE/out/advance-experiment/main/benchmark/compare.py"
          printf 'single=%s\nsplit=%s\nfast=%s\n' \
            "$(git -C "$GITHUB_WORKSPACE/out/advance-experiment/single" rev-parse HEAD)" \
            "$(git -C "$GITHUB_WORKSPACE/out/advance-experiment/split" rev-parse HEAD)" \
            "$(git rev-parse HEAD)"
      - name: A/B iterate (full read) and interleaved updates
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/out/advance-experiment"
          for structure in set vector segtree lazysegtree; do
            target="btree/$structure/iterate"
            echo "::group::A/B split vs fast $target caps=all runs=7"
            python3 "$root/main/benchmark/compare.py" \
              --base-root "$root/split" --dev-root "$GITHUB_WORKSPACE" \
              --target "$target" --caps all --runs 7 \
              --baseline "$root/empty.json"
            echo "::endgroup::"
          done
          for target in \
            btree/vector/iterate_interleaved_reverse \
            btree/segtree/iterate_interleaved_reverse \
            btree/lazysegtree/iterate_interleaved_reverse \
            btree/lazysegtree/iterate_interleaved_apply; do
            echo "::group::A/B split vs fast $target caps=all runs=5"
            python3 "$root/main/benchmark/compare.py" \
              --base-root "$root/split" --dev-root "$GITHUB_WORKSPACE" \
              --target "$target" --caps all --runs 5 \
              --baseline "$root/empty.json"
            echo "::endgroup::"
          done
          echo "All 32 benchmark cases verified"
      - name: Profile dynamic instructions and memory references for advance
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq valgrind
          cat > out/advance-experiment/instrument.cpp <<'CPP'
          #include <bits/stdc++.h>
          #include <valgrind/callgrind.h>
          #include "data-structure/btree/bplustree-vector.hpp"
          #ifndef NODE_CAP
          #define NODE_CAP 32
          #endif
          using Tree = Bplustree_Vector<long long, NODE_CAP>;
          signed main(signed argc, char** argv) {
            if (argc < 2) return 2;
            std::vector<long long> initial(24000);
            std::iota(initial.begin(), initial.end(), 0LL);
            Tree tree(initial.begin(), initial.end());
            const bool with_values = argv[1][0] == 'v';
            long long checksum = 0;
            CALLGRIND_ZERO_STATS;
            CALLGRIND_START_INSTRUMENTATION;
            auto it = tree.begin();
            if (with_values) {
              for (; it != tree.end(); ++it) checksum += *it;
            } else {
              for (; it != tree.end(); ++it) {}
            }
            CALLGRIND_STOP_INSTRUMENTATION;
            if (it != tree.end()) return 3;
            if (with_values &&
                checksum != 24000LL * (24000LL - 1) / 2) return 4;
            std::cout << "ok " << checksum << '\n';
          }
          CPP
          for version in single split fast; do
            lib="$GITHUB_WORKSPACE/out/advance-experiment/$version"
            if [[ "$version" == fast ]]; then lib="$GITHUB_WORKSPACE"; fi
            (
              cd "$lib"
              g++ -std=c++23 -O2 -Wall -Wextra -I. -Idebug -I.deps/ac-library \
                -DNODE_CAP=32 "$GITHUB_WORKSPACE/out/advance-experiment/instrument.cpp" \
                -o "$GITHUB_WORKSPACE/out/advance-experiment/$version.exe"
            )
          done
          for mode in move value; do
            for version in single split fast; do
              dest="$GITHUB_WORKSPACE/out/advance-experiment/callgrind.$mode.$version"
              echo "::group::callgrind $mode $version"
              valgrind --tool=callgrind --instr-atstart=no \
                --cache-sim=yes --branch-sim=yes \
                --callgrind-out-file="$dest" \
                "$GITHUB_WORKSPACE/out/advance-experiment/$version.exe" "$mode"
              echo "::endgroup::"
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          d=Path('out/advance-experiment')
          for mode in ('move','value'):
              print(f'### CALLGRIND MODE={mode} / 24000 elements Cap32')
              for version in ('single','split','fast'):
                  lines=(d/f'callgrind.{mode}.{version}').read_text().splitlines()
                  ev=next(x[7:].split() for x in lines if x.startswith('events: '))
                  sm=next(x[9:].split() for x in lines if x.startswith('summary: '))
                  result=dict(zip(ev,map(int,sm)))
                  print(version, ' '.join(f'{k}={result.get(k,0)}' for k in ('Ir','Dr','Dw','D1mr','D1mw','Bc','Bcm','Bi','Bim')), flush=True)
          PY
      - name: Generate GCC 15.2 assembly for Vector advance
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/out/advance-experiment"
          for version in single split fast; do
            lib="$root/$version"
            if [[ "$version" == fast ]]; then lib="$GITHUB_WORKSPACE"; fi
            (
              cd "$lib"
              g++ -std=c++23 -O2 -Wall -Wextra -I. -Idebug -I.deps/ac-library \
                -DNODE_CAP=32 -c "$root/instrument.cpp" -o "$root/$version.o"
            )
            nm -C -S "$root/$version.o" > "$root/$version.nm"
            objdump -drwC -M intel "$root/$version.o" > "$root/$version.disasm"
            echo "::group::advance symbols $version"
            grep -E 'advance\(long\)|locate<' "$root/$version.nm" | head -15 || true
            echo "::endgroup::"
          done
      - name: Upload profiling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bplustree-advance-callgrind-and-asm
          path: |
            out/advance-experiment/*.nm
            out/advance-experiment/*.disasm
            out/advance-experiment/callgrind.*
            out/advance-experiment/instrument.cpp
          retention-days: 14
