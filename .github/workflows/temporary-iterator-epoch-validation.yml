name: Temporary iterator epoch validation

on:
  push:
    branches:
      - feature/bplustree-iterator-epoch-cache

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ACL and tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3 time
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach 864245a00b00dd008d1abfdc239618fdb7d139da
      - name: Compile and run B+tree tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tests
          for file in data-structure/btree/components/test/*.cpp data-structure/btree/test/*.cpp; do
            echo "::group::$file"
            g++ -std=c++23 -O2 -g -Wall -Wextra -I. -Idebug -I.deps/ac-library "$file" -o out/tests/epoch-test
            timeout 70s out/tests/epoch-test
            echo "::endgroup::"
          done
      - name: Benchmark iterate against pre-epoch implementation
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch origin f8553277fb426c1b3b825c0d16f150e2103f594e
          mkdir -p out/epoch-ab
          git worktree add --detach "$GITHUB_WORKSPACE/out/epoch-ab/old" FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE/out/epoch-ab/old"
          mkdir -p out/epoch-ab/old/.deps
          ln -s "$GITHUB_WORKSPACE/.deps/ac-library" out/epoch-ab/old/.deps/ac-library
          printf '%s\n' '{"schema":1,"records":{}}' > out/epoch-ab/empty.json
          python3 out/epoch-ab/old/benchmark/compare.py \
            --base-root "$GITHUB_WORKSPACE/out/epoch-ab/old" \
            --dev-root "$GITHUB_WORKSPACE" \
            --target btree/vector/iterate --caps 8,32 --runs 3 \
            --baseline out/epoch-ab/empty.json
