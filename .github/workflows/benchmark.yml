name: Performance benchmarks

on:
  workflow_dispatch:
    inputs:
      target:
        description: Benchmark target
        type: choice
        options:
          - all
          - btree/set
          - btree/vector
          - btree/segtree
          - btree/lazysegtree
          - btree/set/insert
          - btree/set/erase
          - btree/set/access
          - btree/vector/insert
          - btree/vector/erase
          - btree/vector/reverse
          - btree/vector/access
          - btree/segtree/prod
          - btree/segtree/insert
          - btree/segtree/erase
          - btree/segtree/reverse
          - btree/segtree/access
          - btree/lazysegtree/prod
          - btree/lazysegtree/apply
          - btree/lazysegtree/insert
          - btree/lazysegtree/erase
          - btree/lazysegtree/reverse
          - btree/lazysegtree/access
        default: all
      caps:
        description: Node capacities
        type: choice
        options:
          - all
          - '8'
          - '16'
          - '32'
          - '64'
        default: all

permissions:
  contents: write

concurrency:
  group: benchmark-records
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git safe directory
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure Python is available
        shell: bash
        run: |
          if ! command -v python3 >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq python3
          fi

      - name: Fetch AtCoder Library
        shell: bash
        run: |
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach \
            864245a00b00dd008d1abfdc239618fdb7d139da

      - name: Load previous bests
        shell: bash
        run: |
          mkdir -p out/benchmark
          # Exit code 0 means the lookup succeeded, even if the branch is absent.
          # A remote/authentication error must fail the workflow rather than reset history.
          git ls-remote --heads origin refs/heads/benchmark-records > out/benchmark/remote-head.txt
          if [[ -s out/benchmark/remote-head.txt ]]; then
            git fetch origin benchmark-records:refs/remotes/origin/benchmark-records
            git show refs/remotes/origin/benchmark-records:best.json > out/benchmark/best.json
          else
            printf '{"schema":1,"records":{}}\n' > out/benchmark/best.json
          fi

      - name: Run and verify benchmarks
        shell: bash
        env:
          BENCHMARK_TARGET: ${{ inputs.target }}
          BENCHMARK_CAPS: ${{ inputs.caps }}
        run: |
          python3 benchmark/run.py --target "$BENCHMARK_TARGET" --caps "$BENCHMARK_CAPS" --runs 5 \
            --baseline out/benchmark/best.json \
            --updated out/benchmark/best-updated.json

      - name: Update best records (main only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/benchmark-records; then
            git switch -C benchmark-records refs/remotes/origin/benchmark-records
          else
            git switch --orphan benchmark-records
            git rm -rf --quiet . || true
          fi
          cp out/benchmark/best-updated.json best.json
          git add best.json
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] \
                -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                commit -m "benchmark: update best records"
            git push origin HEAD:benchmark-records
          fi

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: out/benchmark/
          retention-days: 14
