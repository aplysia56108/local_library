name: Temporary A/B shared benchmark smoke test

on:
  push:
    branches:
      - fix/benchmark-ab-main-shared-workloads

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python, GNU time and ACL
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3 time
          git clone --depth 1 https://github.com/atcoder/ac-library .deps/ac-library
      - name: Unit tests
        shell: bash
        run: python3 -m unittest discover -s benchmark/tests -p 'test_*.py' -v
      - name: Compare Main shuffled-access workload with older dev checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p out/benchmark .deps
          git fetch origin refactor/bplustree-node-pool-ids
          git worktree add --detach "$GITHUB_WORKSPACE/out/benchmark/ab-dev-checkout" FETCH_HEAD
          git config --global --add safe.directory "$GITHUB_WORKSPACE/out/benchmark/ab-dev-checkout"
          mkdir -p out/benchmark/ab-dev-checkout/.deps
          ln -s "$GITHUB_WORKSPACE/.deps/ac-library" out/benchmark/ab-dev-checkout/.deps/ac-library
          printf '{"schema":1,"records":{}}\n' > out/benchmark/best.json
          python3 benchmark/compare.py --base-root "$GITHUB_WORKSPACE" --dev-root "$GITHUB_WORKSPACE/out/benchmark/ab-dev-checkout" --target btree/set/access_random --caps 8 --runs 3 --baseline out/benchmark/best.json
