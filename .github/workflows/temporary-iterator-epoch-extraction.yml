name: Temporary iterator epoch extraction regression

on:
  push:
    branches:
      - feature/bplustree-iterator-epoch-cache

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ACL
        shell: bash
        run: |
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach 864245a00b00dd008d1abfdc239618fdb7d139da
      - name: Compile and run B+tree tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tests
          for file in data-structure/btree/components/test/*.cpp data-structure/btree/test/*.cpp; do
            echo "::group::$file"
            g++ -std=c++23 -O2 -g -Wall -Wextra -I. -Idebug -I.deps/ac-library "$file" -o out/tests/epoch-test
            timeout 70s out/tests/epoch-test
            echo "::endgroup::"
          done
