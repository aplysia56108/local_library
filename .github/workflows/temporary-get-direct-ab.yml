name: Temporary A/B get direct incl iteration
on:
  push:
    branches:
      - experiment/get-direct-ab-20261117
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python, time and ACL
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null || [[ ! -x /usr/bin/time ]]; then
            apt-get update -qq
            apt-get install -y -qq python3 time
          fi
          mkdir -p .deps
          git clone https://github.com/atcoder/ac-library .deps/ac-library
          git -C .deps/ac-library checkout --detach 864245a00b00dd008d1abfdc239618fdb7d139da
      - name: Validate B+tree tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tests
          for file in data-structure/btree/components/test/*.cpp data-structure/btree/test/*.cpp; do
            echo "::group::$file"
            g++ -std=c++23 -O2 -Wall -Wextra -I. -Idebug -I.deps/ac-library "$file" -o out/tests/ab-get
            timeout 70s out/tests/ab-get
            echo "::endgroup::"
          done
      - name: Checkout Main and load best records
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          mkdir -p "$GITHUB_WORKSPACE/out/get-compare"
          main="$GITHUB_WORKSPACE/out/get-compare/main"
          git worktree add --detach "$main" refs/remotes/origin/main
          git config --global --add safe.directory "$main"
          mkdir -p "$main/.deps"
          ln -s "$GITHUB_WORKSPACE/.deps/ac-library" "$main/.deps/ac-library"
          git ls-remote --heads origin refs/heads/benchmark-records > "$GITHUB_WORKSPACE/out/get-compare/records-head"
          if [[ -s "$GITHUB_WORKSPACE/out/get-compare/records-head" ]]; then
            git fetch --no-tags origin "+refs/heads/benchmark-records:refs/remotes/origin/benchmark-records"
            git show refs/remotes/origin/benchmark-records:best.json > "$GITHUB_WORKSPACE/out/get-compare/best.json"
          else
            printf '%s\n' '{"schema":1,"records":{}}' > "$GITHUB_WORKSPACE/out/get-compare/best.json"
          fi
          echo "Main commit: $(git -C "$main" rev-parse HEAD)"
          echo "Dev commit: $(git rev-parse HEAD)"
      - name: Verify A/B benchmark tooling
        shell: bash
        run: |
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/out/get-compare/main/benchmark/tests" -p 'test_*.py'
      - name: A/B access, access_random, iterate
        shell: bash
        run: |
          set -euo pipefail
          main="$GITHUB_WORKSPACE/out/get-compare/main"
          for structure in set vector segtree lazysegtree; do
            for operation in access access_random iterate; do
              target="btree/$structure/$operation"
              echo "::group::A/B $target all caps 5 runs"
              python3 "$main/benchmark/compare.py" \
                --base-root "$main" --dev-root "$GITHUB_WORKSPACE" \
                --target "$target" --caps all --runs 5 \
                --baseline "$GITHUB_WORKSPACE/out/get-compare/best.json"
              echo "::endgroup::"
            done
          done
          echo "All 48 cases verified (4 structures x 3 operations x 4 capacities)"
