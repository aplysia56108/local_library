name: Temporary iterator sentinel regression

on:
  push:
    branches:
      - feature/bplustree-iterator-epoch-cache

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: gcc:15.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run sentinel regressions
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++23 -O2 -Wall -Wextra -I. -Idebug \
            data-structure/btree/components/test/bplustree-base-test.cpp \
            -o /tmp/bplustree-base-test
          /tmp/bplustree-base-test
