name: Publish benchmark best records
description: Commit verified best times and RSS values from main to benchmark-records
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        test -f out/benchmark/best-updated.json

        if git show-ref --verify --quiet refs/remotes/origin/benchmark-records; then
          git switch -C benchmark-records refs/remotes/origin/benchmark-records
        else
          git switch --orphan benchmark-records
          git rm -rf --quiet . || true
        fi
        cp out/benchmark/best-updated.json best.json
        git add best.json
        if ! git diff --cached --quiet; then
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "benchmark: update best records"
          git push origin HEAD:benchmark-records
        fi
